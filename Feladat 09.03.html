<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .hibasInput
    {
        background-color: red;
        color: white;
    }

    .zoldValaszBox
    {
        background-color: darkgreen;
        color: white;
        height: 10px;
        width: 10px;
        font-size: 10px;
        text-align: center;
        font-family: 'Courier New', Courier, monospace;
        display: inline-block;
        margin: 10px;
    }

    body
    {
        font-family: 'Courier New', Courier, monospace;
    }

</style>
<body>

    <label>Adj meg 5 számot!</label><br>
    <input type="number"><br>
    <input type="number"><br>
    <input type="text"><br>
    <input type="text"><br>
    <input type="number"><br>

    <button onclick="sorbaRendez()">Végrehajt</button>

    <div id="megjelenit"></div>


    <script>

        function sorbaRendez()
        {

                let inputok = document.querySelectorAll("input");

                console.log(inputok);

                let szamok = [];

                inputok.forEach(e => {
                    if(parseInt(e.value))
                    {
                        szamok.push(e.value);
                        e.classList.remove("hibasInput");
                    }
                    else
                    {
                        console.log("NEMJÓÓÓ");
                        e.classList.add("hibasInput");
                    }
                });

                console.log(szamok);

                if(szamok.length == 5)
                {
                    document.getElementById("megjelenit").innerHTML = "";
                    szamok.sort(function(a, b){return a - b});

                    szamok.forEach(e =>
                        {
                            let doboz = document.createElement("div")
                            doboz.classList.add("zoldValaszBox");
                            doboz.innerHTML = e;
                            document.getElementById("megjelenit").appendChild(doboz)
                        }
                    )
                }
                else
                {
                    document.getElementById("megjelenit").innerHTML = "";
                    document.getElementById("megjelenit").style.color = "red";
                    document.getElementById("megjelenit").innerHTML = "Nem megfelelő számok!";

                }
    
    

            }

    </script>
</body>
</html>
