<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    
    <div class="container">
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                <div class="row">
                    <div class="col-12 bg-secondary text-danger display-4" id="kijelzo">&nbsp;</div>
                </div>
                <div class="row" id="billentyuzet"></div>
                <div class="row">
                    <div class="col-5 bg-danger text-white text-center p-2" onclick="hivasLerak()">Lerak</div>
                    <div class="col-2"></div>
                    <div class="col-5 bg-success text-white text-center p-2" onclick="hivasIndit()">Felvesz</div>
                    
                </div>
            </div>
        </div>
    </div>


    <script>
        billentyuzet();

        function billentyuzet()
        {
            let billentyuzet = document.getElementById("billentyuzet");

            for(let i = 1;i < 10;i++)
            {
                billentyuzet.appendChild(egyGomb(i));
            }

            billentyuzet.appendChild(egyGomb(""));
            billentyuzet.appendChild(egyGomb(0));
            billentyuzet.appendChild(egyGomb(""));
        }

        function egyGomb(felirat)
        {
            let gomb = document.createElement("div")
            gomb.className = "col-4 bg-info border rounded text-center p-2";
            gomb.innerHTML = felirat;

            gomb.addEventListener("click",e => 
            {
                if(document.getElementById("kijelzo").innerHTML === "&nbsp;")
                {
                    document.getElementById("kijelzo").innerHTML = "";
                }
                document.getElementById("kijelzo").innerHTML += felirat
            }
            )

            return gomb;
        }

        let startTime = 0;

        function hivasIndit()
        {
            console.log("hívás indítása")

            startTime = Date.now();

            console.log(startTime);


        }



        function hivasLerak()
        {
            console.log("hívás lerakva");

            let callTime = Date.now()-startTime;

            const date = new Date(callTime)

            const time = date.toLocaleTimeString("en-GB",{
                timeZone: 'UTC',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
            })

            let hivasInfo = {"kezdet":new Date(startTime).toLocaleDateString(),
                            "hivottSzam":document.getElementById("kijelzo").innerHTML,
                            "hivasHossz":time}

            console.log(hivasInfo);

            document.getElementById("kijelzo").innerHTML = "&nbsp;";
            /*Másik megoldas
            const time2 =
            String(date.getUTCHours()).padStart(2,'0')+ ':' +
            String(date.getUTCMinutes()).padStart(2,'0')+ ':' +
            String(date.getUTCSeconds()).padStart(2,'0'); */
            console.log(time);

            let lista = JSON.parse(localStorage.getItem("lista")) ?? [];
            lista.push(hivasInfo);
            localStorage.setItem("lista",JSON.stringify(lista));


        }

    </script>

</body>
</html>
