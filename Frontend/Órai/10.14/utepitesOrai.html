		function feladat2()
		{
			let sorszam = parseInt(document.getElementById("sorszam").value)
			let eredmeny = document.createElement("div")

			let eredmenyf2 = document.getElementById("eredmenyf2");
			eredmenyf2.innerHTML = "";

			let adat = adatok[sorszam-1];
			console.log(adat.varos)
			eredmeny.innerHTML = `A(z) ${sorszam}. autó ${adat.varos} felé haladt`;
			eredmenyf2.appendChild(eredmeny);

		}

    function feladat3()
    {
      let utolsoKetto = adatok.filter(elem => elem.varos == "F");

      let utolso = utolsoKetto.at(-1);
      
      let utolsoElotti = utolsoKetto.at(-2);


      console.log(utolso,utolsoElotti);


      let utolsoIdo = new Date(2000,1,1,utolso.ora,utolso.perc,utolso.masodperc).getTime();
      
      let utolsoElottiIdo = new Date(2000,1,1,utolsoElotti.ora,utolsoElotti.perc,utolsoElotti.masodperc).getTime();

      console.log(utolsoIdo,utolsoElottiIdo);

      let kulonbseg = utolsoIdo - utolsoElottiIdo;

      console.log(kulonbseg/1000)
      let eredmenyf3 = document.getElementById("eredmenyf3");
			eredmenyf3.innerHTML = "";

      let div = document.createElement("div");
      div.innerHTML = `A különbség az utolsó két jármű között: ${kulonbseg/1000}`;
      eredmenyf3.appendChild(div);
      


    }

    function feladat4()
    {
        const tartalomHelye = document.getElementById("tablaTartalom");

        const sorok = Object.groupBy(adatok,({ora})=> ora);


        Object.keys(sorok).forEach(e=>
          {
            let tr = document.createElement("tr");
            let th = document.createElement("th");
            th.innerHTML = e;
			tr.appendChild(th);

			let td = document.createElement("td");

			td.innerHTML = sorok[e].filter(elem => elem.varos == "A").length;
			tr.appendChild(td);
			
			td = document.createElement("td");

			td.innerHTML = sorok[e].filter(elem => elem.varos == "F").length;
			tr.appendChild(td);
			tartalomHelye.appendChild(tr);

          }
        )

    }

	function feladat5()
	{

		let eredmenyf5 = document.getElementById("eredmenyf5");
		eredmenyf5.innerHTML = "";
		
		let rendezett = adatok.toSorted((a,b) => 
		{
			a.elteltIdo - b.elteltIdo;
		}).slice(0,10);

		console.log(rendezett)

		let ol = document.createElement("ol");

		rendezett.forEach(e =>
		{
			let li = document.createElement("li");
			li.innerHTML = `${e.elteltIdo} s Sebesség: ${e.elteltIdo/1000} m/s A város: ${e.varos}`;
			ol.appendChild(li);
		}
		)

		eredmenyf5.appendChild(ol);

	}
