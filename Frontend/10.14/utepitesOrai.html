<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <div class="container">
        <header class="row bg-dark text-white p-2"><h1>Útépítés érettségi feladat</h1></header>
        <div class="row">
           
    <nav class="navbar navbar-expand-lg navbar-light bg-light col-12">
    <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
		<li class="nav-item">
			<a class="nav-link" href="">Üdv!</a>
		</li>
        <li class="nav-item">
          <a class="nav-link" href="">2.feladat</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">3.feladat</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">4.feladat</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">5.feladat</a>

        <li class="nav-item">
          <a class="nav-link" href="">6.feladat</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</div>
        <main class="row" id="main">
                <h2>Üdv kishaver!</h2>
                <article>
					Szia uram!
                </article>
			</main>
        <footer class="row bg-dark text-white p-2 mt-5"><p> &copy; Loru 2026.10.20.</p></footer>

    </div>

    <script>

        let adatok = [];

        fetch("api.php")
        .then(x => x.json())
        .then(y =>
            {
                //console.log(y);

                adatok = y;
            }
        );

        (function(){

            let menupontok = document.querySelectorAll("nav li");
            
            menupontok.forEach((e,i) =>
                {
                    e.onclick = function(event)
                    {
                        inditas(i+1)
                        event.preventDefault();
                    }
                }
            )
        })();

        function inditas(szam)
        {
          
			console.log(`A feladat száma: ${szam}`);
		  if(szam == 1)
		  {
				document.querySelector("main h2").innerHTML = "Üdv kishaver!";
		  }
		  else
		  {
				document.querySelector("main h2").innerHTML = "Feladat"+szam;
		  }

		  	const f = [];

			f[1] = "Szia uram!";
			f[2] = `<label for="">Adja meg az autó sorszámát:</label>
				<input type="number" name="" id="sorszam">
				<button type="button" class="btn btn-secondary" onclick="feladat2()">Küldés</button>
				<div id="eredmenyf2"></div>`

			document.querySelector("main article").innerHTML = f[szam];
		  

        }

		function feladat2()
		{
			let sorszam = parseInt(document.getElementById("sorszam").value)
			let eredmeny = document.createElement("div")

			let eredmenyf2 = document.getElementById("eredmenyf2");
			eredmenyf2.innerHTML = "";

			let adat = adatok[sorszam-1];
			console.log(adat.varos)
			eredmeny.innerHTML = `A(z) ${sorszam}. autó ${adat.varos} felé haladt`;
			eredmenyf2.appendChild(eredmeny);

		}




    </script>

</body>
</html>
