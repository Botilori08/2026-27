<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <title>User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body onload="selectbetolt()">
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
         <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
            <a class="nav-link" aria-current="page" href="#" onclick="oldalVizsgal(1);return false">Főoldal</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#" onclick="oldalVizsgal(2);return false">Eddigi userek</a>
            </li>
            </ul>
        </div>
        </div>
        </nav>
        <div class="row" id="oldal1">
            <select id="kivalaszt"></select>
        </div>
        <div class="row d-none" id="oldal2">
            2. oldal
        </div>
    </div>

    <script>

        function oldalVizsgal(szam=1)
        {
            if(szam == 1)
            {
                let oldal1 = document.getElementById("oldal1");
                oldal1.classList.remove("d-none");
                let oldal2 = document.getElementById("oldal2");
                if(!oldal2.classList.toggle("d-none"))
                {
                    oldal2.classList.add("d-none");
                }
            }
            if(szam == 2)
            {
                let oldal2 = document.getElementById("oldal2");
                oldal2.classList.remove("d-none");
                let oldal1 = document.getElementById("oldal1");
                oldal1.classList.add("d-none");
            }
        }

        function selectbetolt()
        {
            fetch("https://randomuser.me/api/")
            .then(x => x.json())
            .then( y => 
                {
                    console.log(y);

                    y.results.forEach(e => console.log(e));
                }
            )
        }

    </script>
</body>
</html>
